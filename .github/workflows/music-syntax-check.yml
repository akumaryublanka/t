name: Music Python syntax check

on:
  push:
    branches: [main]
    paths:
      - "waifu/music/**"
      - ".github/workflows/music-syntax-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile music package
        run: python -m compileall -q waifu/music
